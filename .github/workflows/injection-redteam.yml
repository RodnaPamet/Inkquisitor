# Injection red-team — the prompt-injection corpus against the REAL model,
# nightly (Phase 2.H, roadmap item 1: "run garak or an equivalent nightly").
#
# Carved from inflect-compliance's .github/workflows/garak.yml (see
# docs/carve-manifest.md): its skip without a key, its nightly switch, its
# budget and its "a night that probed nothing is not a pass". What it probes
# is Inkquisitor's own: instead of garak's generic probes against an HTTP
# endpoint, the corpus in src/lib/redteam/injection-corpus.json (answers,
# element text, imported notes, research pages and attached files that carry
# instructions) runs through the product's OWN steps — question generation,
# the reconcile step, the research run's findings and fit — over 2.1's
# callStructured, in a throwaway workspace (scripts/injection-redteam.ts).
# What it asserts: src/lib/redteam/injection-suite.ts (no out-of-scope
# proposal, no system-prompt disclosure, nothing of another book, no
# unflagged instruction, no tool beyond the allowlist). The same suite runs
# against a compromised fake model on every pull request
# (tests/unit/redteam/injection-suite.test.ts); this measures the real one.
#
# The safety properties of evals.yml, held by tests/unit/injection-redteam-workflow.test.ts:
#
#   - THE KEY. secrets.ANTHROPIC_API_KEY. Absent, the job SKIPS with a notice
#     and fails nothing; nothing is booted and nothing is sent.
#   - THE NIGHTLY IS OFF UNTIL SWITCHED ON. A scheduled run proceeds only when
#     the repository variable INJECTION_REDTEAM_ENABLED is 'true' (inflect's
#     GARAK_ENABLED rule: a nightly that spends money is an owner's decision);
#     a person's dispatch always runs.
#   - THE BUDGET. `budget_usd` (default 2, at most 10: the runner refuses
#     more) becomes AI_MONTHLY_CEILING_USD_DEFAULT, the throwaway workspace's
#     monthly ceiling, which 2.1 checks against each call's worst case BEFORE
#     it is sent. A scheduled run takes the default.
#   - READ-ONLY. `contents: read` and nothing else: it pushes, commits and
#     opens nothing (no issue, unlike garak.yml); the report is an artifact.
#   - NOT A CHECK. ci.yml neither names nor needs it; no pull request runs it.
#   - THE FAKE WEB. The research run's gather (live web search) is not run:
#     the pages are fixed, as in the evaluations (owner decision, 2026-11-20).
#   - THE ORGANISATION KEY. ANTHROPIC_WORKSPACE_ID (a repository variable) is
#     passed through when set (src/lib/ai/anthropic-workspace.ts).

name: Injection red-team

on:
  schedule:
    # 01:23 UTC daily, off the hour.
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Hard spend budget for the run, US dollars (at most 10)"
        required: true
        default: '2'
        type: string

permissions:
  contents: read

concurrency:
  group: injection-redteam
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  redteam:
    name: Injection red-team (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkquisitor_redteam?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkquisitor_redteam?schema=public
      NODE_ENV: test
      SKIP_ENV_VALIDATION: '1'
      LOG_LEVEL: warn
    steps:
      - name: Check for the model key and the nightly switch
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLED: ${{ vars.INJECTION_REDTEAM_ENABLED }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$ENABLED" != "true" ]; then
            echo "::notice::The injection red-team nightly is switched off (repository variable INJECTION_REDTEAM_ENABLED is not 'true'); dispatch the workflow to run it once."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set for this repository; the red-team run is skipped and nothing is sent."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the budget
        if: steps.key.outputs.present == 'true'
        id: inputs
        env:
          BUDGET: ${{ inputs.budget_usd || '2' }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$BUDGET" | grep -Eq '^[0-9]+(\.[0-9]{1,2})?$'; then echo "::error::budget_usd must be a number of US dollars"; exit 1; fi
          if ! node -e 'const b=Number(process.argv[1]); process.exit(b > 0 && b <= 10 ? 0 : 1)' "$BUDGET"; then echo "::error::budget_usd must be more than 0 and at most 10"; exit 1; fi
          echo "budget=$BUDGET" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4
        if: steps.key.outputs.present == 'true'
      - name: Build the inkquisitor-postgres image (no push)
        if: steps.key.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: deploy/postgres
          file: deploy/postgres/Dockerfile
          push: false
          load: true
          tags: inkquisitor-postgres:redteam-${{ github.sha }}
          cache-from: type=gha,scope=inkquisitor-postgres
      - name: Start Postgres with pgvector
        if: steps.key.outputs.present == 'true'
        run: deploy/postgres/start.sh "inkquisitor-postgres:redteam-${{ github.sha }}" inkquisitor_redteam

      - uses: actions/setup-node@v7
        if: steps.key.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.key.outputs.present == 'true'
        run: npm ci
      - name: Apply migrations
        if: steps.key.outputs.present == 'true'
        run: npm run migrate:deploy

      - name: Run the injection corpus against the model
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          AI_MONTHLY_CEILING_USD_DEFAULT: ${{ steps.inputs.outputs.budget }}
        run: |
          set -uo pipefail
          npm run redteam:injection -- --out redteam-out | tee redteam-summary.md
          status=${PIPESTATUS[0]}
          tee -a "$GITHUB_STEP_SUMMARY" < redteam-summary.md > /dev/null || true
          exit "$status"

      - name: Upload the red-team report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: injection-redteam-report
          path: |
            redteam-out/redteam-report.json
            redteam-summary.md
          if-no-files-found: warn
          retention-days: 14
