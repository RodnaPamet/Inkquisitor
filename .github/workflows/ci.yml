# Inkquisitor CI.
#
#   Lint · Typecheck · Test · Build      the four checks of Phase 0.1
#   Security · CodeQL · Docker           added by Phase 0.4
#   E2E                                  Playwright against the production build
#
# POSTGRES IS BUILT, NOT PULLED (subphase 2.0, owner decision D7). The
# migrations run `CREATE EXTENSION vector`, which the official postgres:16
# image cannot satisfy, so Test and E2E build deploy/postgres/Dockerfile
# (postgres:16-alpine plus pgvector at a pinned tag and commit) in the job,
# with the GitHub Actions cache, and run it with deploy/postgres/start.sh in
# place of a service container. Nothing is pulled from GHCR: a pull request
# tests the Dockerfile it carries, and CI passes before the first publish of
# ghcr.io/rodnapamet/inkquisitor-postgres (.github/workflows/postgres-image.yml).
# Docker builds the same image uncached, smoke-tests it and gates it with the
# same Trivy rule as the application image.
#
# DOCKER HUB IS READ THROUGH A MIRROR (issue #23, item 4). Test, E2E and
# Docker each need postgres:16-alpine, golang and redis (and Docker the node
# base); pulled from Docker Hub on every run they meet its anonymous pull
# limit, a red indistinguishable from a broken build. Every buildx builder is
# configured with Google's public Docker Hub mirror (mirror.gcr.io, no
# credentials) as docker.io's mirror, falling back to Docker Hub when the
# mirror misses; Redis is run from the mirror by name. Digests are unchanged
# (the golang stage is pinned by digest and the mirror serves the same
# manifests), and the GitHub Actions cache still holds the built layers.
#
# Job names are the check names a branch protection rule requires; renaming
# one silently drops it from the required set (a check that never runs is
# indistinguishable from one that passed). tests/unit/ci-workflow.test.ts
# pins every name.
#
# No job holds a secret. The build runs with SKIP_ENV_VALIDATION=1, the same
# as the Docker builder: real values are provided at run time.
#
# Third-party actions are pinned to a major version (GitHub's own) or an
# exact release (trivy-action, which publishes no major tag). Permissions are
# read-only at the top; the one job that writes (CodeQL's SARIF upload) asks
# for exactly that, on its own.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request's runs share one group per PR number, and a newer push to it
# cancels the run in flight. A push to main gets a group of its own per COMMIT
# (github.sha): `cancel-in-progress: false` only spares a RUNNING run, and a
# group holds just one PENDING run, so a per-ref main group would let a third
# push evict the commit waiting between the other two, and that commit would
# never get CI. A cancelled run reads like a passed one, so nothing would say
# so. Same keying as inflect-compliance's ci.yml.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NEXT_TELEMETRY_DISABLED: '1'
  # Husky installs git hooks on `npm ci` (the `prepare` script); a CI runner
  # commits nothing, so it is switched off for every job.
  HUSKY: '0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # `npm ci` runs the postinstall `prisma generate`, so the Prisma client
      # types exist before tsc reads them.
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    # Ten minutes more than before 2.0: a cold cache compiles gosu and
    # pgvector in the Postgres image build.
    timeout-minutes: 30
    # Postgres is not a service here: see "POSTGRES IS BUILT, NOT PULLED" at
    # the top. The readiness probe and the job worker's integration tests
    # need a real Redis (they use logical database 14).
    services:
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkquisitor_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkquisitor_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      # Postgres with pgvector, from the Dockerfile in this checkout.
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the inkquisitor-postgres image (no push)
        uses: docker/build-push-action@v7
        with:
          context: deploy/postgres
          file: deploy/postgres/Dockerfile
          push: false
          load: true
          tags: inkquisitor-postgres:ci-${{ github.sha }}
          cache-from: type=gha,scope=inkquisitor-postgres
          cache-to: type=gha,scope=inkquisitor-postgres,mode=max,ignore-error=true
      - name: Start Postgres with pgvector
        run: deploy/postgres/start.sh "inkquisitor-postgres:ci-${{ github.sha }}" inkquisitor_test
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test -- --ci
      # The integration project runs against the schema the migrations
      # produce, never one pushed from the Prisma schema.
      - name: Apply migrations
        run: npm run migrate:deploy
      - name: Integration tests
        run: npm run test:integration -- --ci

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIP_ENV_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Next's build cache, keyed on the lockfile and the sources.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'packages/**', 'next.config.mjs') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # `next build --webpack`, then BLOCKING on any warning it printed, a
      # Node-only module in the proxy bundle, or a server env variable named
      # in a client chunk (scripts/check-build.js, Phase 0.H).
      - run: npm run build:check
      # The worker ships as its own bundle; a broken import fails here, not
      # at the first deploy.
      - run: npm run build:worker

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # BLOCKING on moderate and above in the production dependency tree:
      # a finding there is shipped code. Never lower the level to get a PR
      # through; upgrade the dependency instead.
      - name: 'Gate: npm audit (production, moderate+)'
        run: npm audit --omit=dev --audit-level=moderate
      # The same scanner the pre-commit hook runs, over every tracked file —
      # the half of the secret detection a `git commit --no-verify` cannot skip.
      - name: 'Gate: secret scan (every tracked file)'
        run: bash scripts/detect-secrets.sh --all

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      # The SARIF upload to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          # The SARIF is always written here: the gate below reads it, and the
          # artifact keeps it, whether or not code scanning receives it.
          output: codeql-results
          # The upload needs code scanning enabled for the repository (free on
          # a public repository, GitHub Advanced Security on a private one).
          # Set the repository variable CODE_SCANNING_ENABLED=true once it is;
          # until then the results reach the artifact and the gate only.
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}
      - name: Keep the SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # BLOCKING on a security result of high or critical severity, or of
      # level error (scripts/sarif-gate.js). analyze never fails the job on
      # what it finds, so without this the check is green whatever it found.
      # A SARIF folder with nothing in it fails too.
      - name: 'Gate: CodeQL security results (high+, or error)'
        run: node scripts/sarif-gate.js codeql-results

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: inkquisitor:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      # BLOCKING on CRITICAL and HIGH, ignoring vulnerabilities with no fixed
      # version (nothing to upgrade to). Never narrow the severities to get a
      # PR through; fix the base image or the dependency.
      - name: 'Gate: Trivy (CRITICAL,HIGH, fixable)'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inkquisitor:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          # Trivy's own deadline (5m by default) is not the job's
          # timeout-minutes: a slow database download aborts with `context
          # deadline exceeded` and exit 1, a red indistinguishable from a CVE
          # (inflect-compliance hit it twice on this action and base image).
          timeout: '15m'
      # The Postgres image (deploy/postgres/, D7): built uncached against the
      # current upstream 16-alpine tag, so this judges what a publish today
      # would ship; smoke-tested (the extension, a cosine query through HNSW,
      # musl, no toolchain, the rebuilt gosu); and gated by the same rule.
      # Never pushed from here: .github/workflows/postgres-image.yml publishes.
      - name: Build the inkquisitor-postgres image (no push)
        uses: docker/build-push-action@v7
        with:
          context: deploy/postgres
          file: deploy/postgres/Dockerfile
          push: false
          load: true
          pull: true
          no-cache: true
          tags: inkquisitor-postgres:ci-${{ github.sha }}
      - name: Smoke-test the inkquisitor-postgres image
        run: deploy/postgres/smoke.sh "inkquisitor-postgres:ci-${{ github.sha }}"
      - name: 'Gate: Trivy of the inkquisitor-postgres image (CRITICAL,HIGH, fixable)'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inkquisitor-postgres:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          timeout: '15m'

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Ten minutes more than before 2.0, for the same cold Postgres image build.
    timeout-minutes: 35
    # The same Postgres as Test: the specs drive the production build, which
    # reads and writes the database (Phase 0.3).
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkquisitor_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkquisitor_test?schema=public
      # No REDIS_URL here: the specs run the PRODUCTION build, whose start-up
      # check refuses a Redis URL without a password. playwright.config.ts
      # supplies redis://:e2e@localhost:6379, and the step below starts a
      # Redis that requires exactly that (a service container cannot pass
      # --requirepass).
      SKIP_ENV_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v7
      # Postgres with pgvector, from the Dockerfile in this checkout.
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the inkquisitor-postgres image (no push)
        uses: docker/build-push-action@v7
        with:
          context: deploy/postgres
          file: deploy/postgres/Dockerfile
          push: false
          load: true
          tags: inkquisitor-postgres:ci-${{ github.sha }}
          cache-from: type=gha,scope=inkquisitor-postgres
          cache-to: type=gha,scope=inkquisitor-postgres,mode=max,ignore-error=true
      - name: Start Postgres with pgvector
        run: deploy/postgres/start.sh "inkquisitor-postgres:ci-${{ github.sha }}" inkquisitor_test
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The headless-shell build that matches the pinned @playwright/test
      # (what headless Chromium runs). No --with-deps: that apt-installs
      # fonts from Ubuntu's mirrors, which the runner image does not need
      # (it ships Chrome's system libraries) and whose timeouts failed the
      # job's first run before a single spec ran.
      - run: npx playwright install --only-shell chromium
      - name: Start Redis with a password
        run: |
          docker run -d --name e2e-redis -p 6379:6379 mirror.gcr.io/library/redis:7-alpine redis-server --requirepass e2e
          for i in $(seq 1 30); do docker exec e2e-redis redis-cli -a e2e --no-auth-warning ping | grep -q PONG && exit 0; sleep 1; done
          echo "Redis did not come up"; exit 1
      - name: Apply migrations
        run: npm run migrate:deploy
      # Next's build cache, keyed on the lockfile and the sources.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'packages/**', 'next.config.mjs') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      # playwright.config.ts starts `next start` on :3100 and waits for
      # /api/health before the specs run.
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
