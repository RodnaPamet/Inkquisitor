# Release — semantic-release on main, with GITHUB_TOKEN alone.
#
# On each push to main, semantic-release reads the conventional commits since
# the last tag, decides the next version (feat → minor, fix/perf → patch,
# BREAKING CHANGE → major), pushes a `v<version>` tag and publishes a GitHub
# Release with generated notes. That is all it does (.releaserc.json):
#
#   - No commit back to main. inflect-compliance's release pushes a
#     `chore(release)` commit (CHANGELOG.md, package.json) through
#     @semantic-release/git, which a protected main refuses from
#     GITHUB_TOKEN; it needs a GitHub App token as a ruleset bypass actor.
#     Without the git and changelog plugins the workflow needs no credential
#     beyond the job's own token: a tag is not a branch update, and the
#     release is one API call. The version lives in the tag and the release;
#     package.json stays 0.0.0 (the package is private and never published).
#   - No npm publish, and no issue or pull-request comments, so the token
#     needs `contents: write` and nothing else.
#
# semantic-release and the plugins it loads are installed with `npm ci` from
# `release/package-lock.json`, not resolved by npx at run time: this job holds
# a token that can push tags and create releases, so every package that runs
# under it is the exact version the lockfile names, reviewed in a diff, never
# whatever a semver range resolves to that morning. The tree lives in its own
# folder rather than the root devDependencies because the application never
# imports it. Install scripts are not run. The checkout does not persist the
# token in .git/config (`persist-credentials: false`): only semantic-release's
# own environment receives it. A release does not deploy anything.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      # Push the tag and create the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit and tag since the last release is read.
          fetch-depth: 0
          # The token reaches semantic-release's env below and nothing else.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install the release tooling (locked)
        run: npm ci --prefix release --ignore-scripts --no-audit --no-fund
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./release/node_modules/.bin/semantic-release
