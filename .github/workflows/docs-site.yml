# Docs site — the Starlight help site, https://rodnapamet.github.io/Inkquisitor/
#
# Publishes docs/user/ and nothing else (site/manifest.json is an allowlist;
# site/scripts/stage-docs.js refuses the roadmap and every internal doc).
#
# BUILD runs on every pull request that touches the docs or the site, so a
# broken page or a refused doc fails the PR that caused it. Not a required
# check.
#
# DEPLOY runs only on main, and only once GitHub Pages is enabled for the
# repository with "GitHub Actions" as its source (Settings → Pages). Until
# then the deploy job is skipped and the build leaves a warning saying why:
# a repository without Pages does not fail. Enabling Pages is an admin's act;
# GITHUB_TOKEN cannot do it, and this workflow never tries.
#
# Adapted from inflect-compliance's .github/workflows/docs-site.yml.

name: Docs site

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/docs-site.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The site has its own package.json and lockfile, apart from the app's.
      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Stage and build
        working-directory: site
        run: npm run build
      - name: Say why nothing will deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.has_pages
        run: echo "::warning title=Docs site not deployed::GitHub Pages is not enabled for this repository. A repository admin enables it at Settings → Pages with 'GitHub Actions' as the source, then re-runs this workflow."
      - name: Upload the site for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.has_pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy docs site
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.has_pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, never cancelled midway.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
